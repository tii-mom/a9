name = "fuse-protocol"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 前端构建产物（web/dist）由同一个 Worker 托管，SPA 回退
assets = { directory = "../web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*"] }

[observability]
enabled = true

[triggers]
# 每分钟推进一次演示/模拟状态机（真实链上模式下只做缓存刷新）
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fuse-protocol"
database_id = "b5945609-374e-4eaa-add2-80460ebcb680"

[vars]
DATA_SOURCE = "demo"
# 演示加速：1 根 4 小时 K 线用多少秒走完（真实模式忽略）
DEMO_CANDLE_SECONDS = "90"
# 演示钱包初始余额（raw units，9 位精度）
DEMO_WALLET_BALANCE = "250000000000000"
ALLOWED_ORIGINS = "*"
