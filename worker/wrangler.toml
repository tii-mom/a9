name = "fuse-protocol"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 前端构建产物（web/dist）由同一个 Worker 托管，SPA 回退。
# run_worker_first = true：所有请求（含静态资源）都经过 Worker，以便统一追加安全响应头。
assets = { directory = "../web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }

[observability]
enabled = true

[triggers]
# 每分钟推进一次演示/模拟状态机（真实链上模式下只做缓存刷新）
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fuse-protocol"
database_id = "b5945609-374e-4eaa-add2-80460ebcb680"

[vars]
DATA_SOURCE = "demo"
# 演示加速：1 根 4 小时 K 线用多少秒走完（真实模式忽略）
DEMO_CANDLE_SECONDS = "90"
# 演示钱包初始余额（raw units，9 位精度）
DEMO_WALLET_BALANCE = "250000000000000"
# 演示自维持：终态后自动开下一轮 / 十轮结束后重置演示（chain 模式强制关闭）
DEMO_AUTOPLAY = "true"
# 演示质押窗口时长（秒）
DEMO_STAKE_SECONDS = "900"
# 演示「解锁中」展示时长（秒）：R10 终态后先展示 ClaimUnlocked 再重置演示
DEMO_UNLOCK_SECONDS = "1800"
# 结算后预告期（演示加速，用于展示"距离下一轮质押开始"倒计时）
DEMO_PREVIEW_SECONDS = "90"
# 生产 CORS 白名单（本地 dev 走 vite 同源代理，不需要 *）
ALLOWED_ORIGINS = "https://a9.lat,https://www.a9.lat"
# 演示环境显式允许无签名写接口（生产/chain 必须删除或设为 false）
DEMO_ALLOW_UNSIGNED_WRITES = "true"
# ton_proof 允许的 domain（逗号分隔；生产只保留 a9.lat 系列）
TON_PROOF_DOMAINS = "a9.lat,www.a9.lat,localhost,127.0.0.1"
# 最简限流：每个 IP+路径 每分钟请求数（D1 计数，保护 admin/stake/claim）
RATE_LIMIT_PER_MINUTE = "60"
# /api/auth/nonce 单独更低配额（D1 计数）
RATE_LIMIT_NONCE_PER_MINUTE = "10"
# 协议只读 GET 的内存级限流（不写 D1）
RATE_LIMIT_READ_PER_MINUTE = "120"
# 静态资源 GET 的内存级限流（不写 D1）
RATE_LIMIT_STATIC_PER_MINUTE = "600"
# 语义化版本 / 部署核对信息（部署时可用 --var GIT_SHA:xxx --var DEPLOYED_AT:xxx 覆盖）
VERSION = "1.0.0"
# GIT_SHA = ""
# DEPLOYED_AT = ""
# GET 微缓存秒数（0 = 关闭），降低页面 2~3s 轮询对 D1 的读取压力
EDGE_CACHE_SECONDS = "1"
# TON Connect manifest（由前端 public/ 提供）
TONCONNECT_MANIFEST_URL = "/tonconnect-manifest.json"

# ---------------------------------------------------------------------------
# 自定义域名（a9.lat 已在本账号 Cloudflare 托管；路由必须放在所有表定义之后）
# 生产主域：a9.lat，www 一并绑定后由 Worker 统一返回
# ---------------------------------------------------------------------------
[[routes]]
pattern = "a9.lat"
custom_domain = true

[[routes]]
pattern = "www.a9.lat"
custom_domain = true

# ===========================================================================
# 生产环境（CI deploy 使用 --env production；本地 wrangler dev 仍用上面的 [vars] demo）
#
# 审查 P0：默认 [vars] 是 demo + DEMO_ALLOW_UNSIGNED_WRITES=true，绝不能被直接部署到
# 生产 a9.lat。因此：
#   1) 生产配置全部在这里显式声明（vars / d1 绑定不会被 env 继承，必须重复声明）；
#   2) 地址/配置哈希只放**占位符**（D-38：仓库公开，禁止提交主网真实地址）；
#   3) CI deploy 前有硬门禁：DATA_SOURCE != chain / DEMO_ALLOW_UNSIGNED_WRITES != false /
#      CHAIN_NETWORK != mainnet / 地址或哈希仍是占位符 → 直接 fail（除显式 allow_demo_deploy）。
#   GitHub Variables（PROD_ROUND_CONTROLLER_ADDRESS 等）会在部署时通过 --var 注入真实值。
# ===========================================================================
[env.production]
# 与顶层同名，确保部署覆盖现有 Worker（保留 a9.lat / www 自定义域名）
name = "fuse-protocol"

[env.production.vars]
DATA_SOURCE = "chain"
CHAIN_NETWORK = "mainnet"
DEMO_AUTOPLAY = "false"
DEMO_ALLOW_UNSIGNED_WRITES = "false"

# 链上数据源（toncenter）
TONCENTER_V2_URL = "https://toncenter.com/api/v2"
TONCENTER_V3_URL = "https://toncenter.com/api/v3"

# 主网合约/配置：部署时由 CI 用 GitHub Variables 注入；仓库内只保留占位符
ROUND_CONTROLLER_ADDRESS = "0:__ROUND_CONTROLLER_ADDRESS__"
TEAM_VAULT_ADDRESS = "0:__TEAM_VAULT_ADDRESS__"
JETTON_MASTER_ADDRESS = "0:__JETTON_MASTER_ADDRESS__"
ORACLE_CONFIG_VERSION = "1"
ORACLE_CONFIG_HASH = "__ORACLE_CONFIG_HASH__"

# 生产安全 / 限流 / 展示参数（与 demo 段一致的公共项）
ALLOWED_ORIGINS = "https://a9.lat,https://www.a9.lat"
TON_PROOF_DOMAINS = "a9.lat,www.a9.lat"
RATE_LIMIT_PER_MINUTE = "60"
RATE_LIMIT_NONCE_PER_MINUTE = "10"
RATE_LIMIT_READ_PER_MINUTE = "120"
RATE_LIMIT_STATIC_PER_MINUTE = "600"
VERSION = "1.0.0"
EDGE_CACHE_SECONDS = "1"
TONCONNECT_MANIFEST_URL = "/tonconnect-manifest.json"

# D1 绑定不会被 env 继承，必须在生产环境重复声明（同一个库；id 非机密）
[[env.production.d1_databases]]
binding = "DB"
database_name = "fuse-protocol"
# 审查 P0：生产 D1 必须与演示库分离，绝不能复用顶层 demo 的 database_id。
# 仓库内只放占位符；部署前由 CI 用 GitHub Variable PROD_D1_DATABASE_ID 注入真实主网 D1 ID。
database_id = "00000000-0000-0000-0000-000000000000"

# 自定义域名（env 会继承顶层 routes，但显式声明可避免 wrangler 的
# "environment inherits custom domains" 警告，并保证生产路由不被默认环境抢占）
[[env.production.routes]]
pattern = "a9.lat"
custom_domain = true

[[env.production.routes]]
pattern = "www.a9.lat"
custom_domain = true