        - generic [ref=f4e673]: WARNING · Read before you fight
        - generic [ref=f4e674]: Risk disclosure v1
      - list [ref=f4e675]:
        - listitem [ref=f4e676]:
          - generic [ref=f4e679]: If the round fails, 100% of staked principal is burned. The 700M reward for that round is burned as well. Your stake has no capital protection.
        - listitem [ref=f4e680]:
          - generic [ref=f4e683]: The target doubles every round. Round 10 targets 1024× the initial reference price. The protocol does not guarantee price appreciation or that rewards will be realized.
        - listitem [ref=f4e684]:
          - generic [ref=f4e687]: TWAP and multi-source oracles only raise the cost of manipulation. They cannot guarantee the price is unmanipulable and cannot prevent selling.
        - listitem [ref=f4e688]:
          - generic [ref=f4e691]: Technical failure and market failure are different things. An oracle outage only pauses scoring and never burns principal. Smart contracts may still contain undiscovered bugs; the audit report will be published before mainnet opens.
        - listitem [ref=f4e692]:
          - generic [ref=f4e695]: Splitting across wallets cannot be fully prevented. Per-address caps only mitigate; they cannot prove a unique human.
        - listitem [ref=f4e696]:
          - generic [ref=f4e699]: Compliance risk is yours to judge. This mechanism may touch rules on financial products, gambling, promotions and consumer protection in various jurisdictions. Seek professional advice before participating. This page is not investment advice.
