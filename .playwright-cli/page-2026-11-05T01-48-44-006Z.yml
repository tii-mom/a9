        - generic [ref=f6e608]: WARNING · Read before you fight
        - generic [ref=f6e609]: Risk disclosure v1
      - list [ref=f6e610]:
        - listitem [ref=f6e611]:
          - generic [ref=f6e614]: If the round fails, 100% of staked principal is burned. The 750M reward for that round is burned as well. Your stake has no capital protection.
        - listitem [ref=f6e615]:
          - generic [ref=f6e618]: The target doubles every round. Round 10 targets 1024× the initial reference price. The protocol does not guarantee price appreciation or that rewards will be realized.
        - listitem [ref=f6e619]:
          - generic [ref=f6e622]: TWAP and multi-source oracles only raise the cost of manipulation. They cannot guarantee the price is unmanipulable and cannot prevent selling.
        - listitem [ref=f6e623]:
          - generic [ref=f6e626]: Technical failure and market failure are different things. An oracle outage only pauses scoring and never burns principal. Smart contracts may still contain undiscovered bugs; the audit report will be published before mainnet opens.
        - listitem [ref=f6e627]:
          - generic [ref=f6e630]: Splitting across wallets cannot be fully prevented. Per-address caps only mitigate; they cannot prove a unique human.
        - listitem [ref=f6e631]:
          - generic [ref=f6e634]: Compliance risk is yours to judge. This mechanism may touch rules on financial products, gambling, promotions and consumer protection in various jurisdictions. Seek professional advice before participating. This page is not investment advice.
