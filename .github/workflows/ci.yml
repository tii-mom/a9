name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_e2e_skip:
        description: '显式允许跳过 E2E（仅用于 E2E_BASE_URL 不可用时的应急；会在 job summary 留痕，默认 false）'
        type: boolean
        default: false
      allow_demo_deploy:
        description: '显式允许用 demo 配置部署到生产（仅演示用途；会跳过 chain/mainnet 部署门禁，默认 false）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 冒烟/本地 D1 用固定 admin token（仅 CI 环境，非生产 secret）
  CI_ADMIN_TOKEN: ci-admin-token

jobs:
  verify:
    name: typecheck + build (web + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Guard: migrations 目录只允许 NNNN_*.sql"
        # S-2 防呆：seed 放进 migrations/ 会被 wrangler d1 migrations apply 当迁移执行（生产灌假数据）
        run: |
          bad=0
          for f in worker/migrations/*.sql; do
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9]_*.sql) ;;
              *) echo "::error::非迁移文件出现在 worker/migrations: $base（seed 请放 worker/seed/，禁止再塞回迁移目录）"; bad=1 ;;
            esac
          done
          if [ "$bad" != "0" ]; then exit 1; fi
          echo "migrations OK:"
          ls worker/migrations
      - name: Typecheck (web + worker)
        run: pnpm typecheck
      - name: Build web
        run: pnpm build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  contracts:
    name: contracts (acton test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Acton 1.1.0 (pinned, audited hashes were built with it)
        run: |
          set -euo pipefail
          url=https://github.com/ton-blockchain/acton/releases/download/v1.1.0/acton-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o /tmp/acton.tgz "$url"
          echo "c2e640eacbb5b6ece1c343cab2ab6d2db74643d0706777aad181ed7e6e1bfc16  /tmp/acton.tgz" | sha256sum -c -
          mkdir -p "$HOME/.acton/bin"
          tar xzf /tmp/acton.tgz -C "$HOME/.acton/bin"
          export PATH="$HOME/.acton/bin:$PATH"
          acton --version
      - name: acton test
        working-directory: contracts
        run: |
          export PATH="$HOME/.acton/bin:$PATH"
          acton test

  ops-selftest:
    name: ops selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node ops/scripts/selftest.mjs
        run: node ops/scripts/selftest.mjs

  worker-smoke:
    name: worker typecheck + D1 migrate + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Worker typecheck
        working-directory: worker
        run: ./node_modules/.bin/tsc --noEmit
      - name: Prepare local D1 (fast demo seed)
        working-directory: worker
        run: |
          echo "ADMIN_TOKEN=$CI_ADMIN_TOKEN" > .dev.vars
          # seed 已移出 migrations，必须显式执行（migrations 只建表 / 不灌演示数据）
          DEMO_CANDLE_SECONDS=2 EPOCH=$(( $(date +%s) * 1000 + 20000 )) node scripts/generate-seed.mjs
          rm -rf .wrangler/state
          ./node_modules/.bin/wrangler d1 migrations apply fuse-protocol --local
          ./node_modules/.bin/wrangler d1 execute fuse-protocol --local --file=./seed/seed.sql
      - name: Start wrangler dev
        working-directory: worker
        run: |
          (./node_modules/.bin/wrangler dev --port 8787 --var DEMO_CANDLE_SECONDS:2 --var DEMO_PREVIEW_SECONDS:2 > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          curl -s http://127.0.0.1:8787/api/health | head -c 200
      - name: Smoke
        working-directory: worker
        env:
          SMOKE_BASE: http://127.0.0.1:8787
          SMOKE_TIMEOUT: "240"
        run: node scripts/smoke.mjs
      - name: Dump wrangler log on failure
        if: failure()
        run: tail -120 /tmp/wrangler.log || true

  qa-logic:
    name: qa chain logic (rejection / aborted receipt / nonce)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chain negative cases (pure logic)
        run: node qa/chain-logic.mjs

  e2e:
    name: e2e (required release gate)
    # E2E 需要已部署的目标环境；PR（含 fork）不跑，主分支 push 与 workflow_dispatch 必跑。
    # E2E_BASE_URL 必须指向「本次发布目标环境」（当前线上 / 预发），因此它是发布前门禁：
    #   - secret 缺失 → 默认让 deploy 失败（不再静默跳过）；
    #   - 应急放行 → workflow_dispatch 勾选 allow_e2e_skip=true，job summary 留痕。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: E2E against target URL (required; missing secret fails unless explicitly allowed)
        working-directory: qa
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ALLOW_E2E_SKIP: ${{ inputs.allow_e2e_skip }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            if [ "$ALLOW_E2E_SKIP" = "true" ]; then
              echo "::warning::E2E_BASE_URL 未配置，但 workflow_dispatch 显式 allow_e2e_skip=true —— 本次跳过 E2E（已留痕）"
              {
                echo "## ⚠️ E2E 被显式跳过"
                echo ""
                echo "- 原因：E2E_BASE_URL secret 未配置"
                echo "- 授权：workflow_dispatch inputs.allow_e2e_skip=true"
                echo "- 结论：本次部署**未经** E2E 验收，仅作应急放行；请尽快补齐 secret 并重跑。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::E2E_BASE_URL 未配置：e2e 已是 deploy 必需门禁。请配置 secret E2E_BASE_URL；如确需应急放行，请用 workflow_dispatch 勾选 allow_e2e_skip（会在 summary 留痕）。"
            exit 1
          fi
          pnpm exec playwright install --with-deps chromium
          node e2e.mjs "$E2E_BASE_URL"

  deploy:
    name: deploy (production)
    # 手动 deploy（workflow_dispatch）与 main push 都可触发；门禁默认仍然 fail，只有显式 allow_demo_deploy 才放行并在 summary 留痕。
    needs: [verify, contracts, ops-selftest, worker-smoke, qa-logic, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://a9.lat
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_TG_BOT_USERNAME: ${{ vars.PROD_TG_BOT_USERNAME }}
      - name: "Guard: migrations 目录只允许 NNNN_*.sql"
        # S-2 防呆：任何非迁移 .sql 混入 migrations/ 都会让生产 apply 执行它（例如演示 seed）
        run: |
          bad=0
          for f in worker/migrations/*.sql; do
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9]_*.sql) ;;
              *) echo "::error::非迁移文件出现在 worker/migrations: $base（seed 请放 worker/seed/）"; bad=1 ;;
            esac
          done
          if [ "$bad" != "0" ]; then exit 1; fi
          echo "migrations OK:"
          ls worker/migrations
      - name: "Inject production D1 database id"
        # 审查 P0：生产 D1 与演示 D1 必须分离。仓库只有占位符；部署前从 GitHub Variable 注入工作副本。
        working-directory: worker
        env:
          PROD_D1_DATABASE_ID: ${{ vars.PROD_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          path = 'wrangler.toml'
          text = open(path).read()
          value = os.environ.get('PROD_D1_DATABASE_ID', '').strip()
          if not value:
              print('::warning::PROD_D1_DATABASE_ID 未配置，保留占位符（门禁会 FAIL）')
          else:
              block = re.search(r'\[\[env\.production\.d1_databases\]\].*?(?=\n\[|\Z)', text, re.S)
              if not block:
                  raise SystemExit('wrangler.toml 缺少 [[env.production.d1_databases]]')
              updated = re.sub(r'database_id\s*=\s*"[^"]*"', 'database_id = "' + value + '"', block.group(0), count=1)
              text = text[:block.start()] + updated + text[block.end():]
              open(path, 'w').write(text)
              print('✅ 已注入生产 D1 ID（值不打印）')
          PY
      - name: "Gate: production config (chain / mainnet / no unsigned writes)"
        # P0 门禁：默认 [vars] 是 demo，绝不能直接部署到生产。
        # 读取 [env.production.vars]（叠加 GitHub Variables 注入的地址），并检查生产 D1 != demo D1。
        working-directory: worker
        env:
          ALLOW_DEMO_DEPLOY: ${{ inputs.allow_demo_deploy }}
          PROD_ROUND_CONTROLLER_ADDRESS: ${{ vars.PROD_ROUND_CONTROLLER_ADDRESS }}
          PROD_TEAM_WALLET_ADDRESS: ${{ vars.PROD_TEAM_WALLET_ADDRESS }}
          PROD_KEEPER_ADDRESS: ${{ vars.PROD_KEEPER_ADDRESS }}
          PROD_JETTON_MASTER_ADDRESS: ${{ vars.PROD_JETTON_MASTER_ADDRESS }}
          PROD_ORACLE_CONFIG_HASH: ${{ vars.PROD_ORACLE_CONFIG_HASH }}
          PROD_JUNXIANG_DISTRIBUTOR_ADDRESS: ${{ vars.PROD_JUNXIANG_DISTRIBUTOR_ADDRESS }}
          PROD_TG_BOT_USERNAME: ${{ vars.PROD_TG_BOT_USERNAME }}
          PROD_D1_DATABASE_ID: ${{ vars.PROD_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib

          allow_demo = os.environ.get('ALLOW_DEMO_DEPLOY', '').strip().lower() == 'true'
          with open('wrangler.toml', 'rb') as f:
              cfg = tomllib.load(f)
          prod = cfg.get('env', {}).get('production', {})
          values = dict(prod.get('vars', {}) or {})

          overrides = {
              'ROUND_CONTROLLER_ADDRESS': os.environ.get('PROD_ROUND_CONTROLLER_ADDRESS', ''),
              'TEAM_WALLET_ADDRESS': os.environ.get('PROD_TEAM_WALLET_ADDRESS', ''),
              'KEEPER_ADDRESS': os.environ.get('PROD_KEEPER_ADDRESS', ''),
              'JETTON_MASTER_ADDRESS': os.environ.get('PROD_JETTON_MASTER_ADDRESS', ''),
              'ORACLE_CONFIG_HASH': os.environ.get('PROD_ORACLE_CONFIG_HASH', ''),
              'JUNXIANG_DISTRIBUTOR_ADDRESS': os.environ.get('PROD_JUNXIANG_DISTRIBUTOR_ADDRESS', ''),
              'TG_BOT_USERNAME': os.environ.get('PROD_TG_BOT_USERNAME', ''),
          }
          for key, value in overrides.items():
              if value.strip():
                  values[key] = value.strip()

          errors = []
          expected = {
              'DATA_SOURCE': 'chain',
              'DEMO_ALLOW_UNSIGNED_WRITES': 'false',
              'CHAIN_NETWORK': 'mainnet',
          }
          for key, want in expected.items():
              got = str(values.get(key, ''))
              if got != want:
                  errors.append(f'{key}={got!r}，要求 {want!r}')

          required = [
              'ROUND_CONTROLLER_ADDRESS', 'TEAM_WALLET_ADDRESS', 'KEEPER_ADDRESS', 'JETTON_MASTER_ADDRESS',
              'ORACLE_CONFIG_HASH', 'TONCENTER_V2_URL', 'TONCENTER_V3_URL',
              'JUNXIANG_DISTRIBUTOR_ADDRESS', 'TG_BOT_USERNAME',
          ]
          for key in required:
              got = str(values.get(key, '')).strip()
              if not got or '__' in got or 'PLACEHOLDER' in got.upper():
                  errors.append(f'{key} 未注入真实值（当前 {got!r}；用 GitHub Variables PROD_* 注入，禁止把主网地址提交进仓库 D-38）')

          demo_d1 = (cfg.get('d1_databases') or [{}])[0].get('database_id', '')
          rows = prod.get('d1_databases') or []
          prod_d1 = str(rows[0].get('database_id', '') if rows else '').strip()
          override_d1 = os.environ.get('PROD_D1_DATABASE_ID', '').strip()
          if override_d1:
              prod_d1 = override_d1
          if not prod_d1:
              errors.append('env.production.d1_databases.database_id 为空')
          elif re.fullmatch(r'0{8}-0{4}-0{4}-0{4}-0{12}', prod_d1) or '__' in prod_d1 or 'PLACEHOLDER' in prod_d1.upper():
              errors.append(f'生产 D1 database_id 仍是占位符（{prod_d1}）；用 GitHub Variable PROD_D1_DATABASE_ID 注入')
          elif demo_d1 and prod_d1 == demo_d1:
              errors.append('生产 D1 database_id 与顶层 demo 相同（' + prod_d1 + '）：主网迁移/索引器会写进演示库')

          if errors and not allow_demo:
              print('::error::生产部署门禁失败：即将部署的 env.production 不是 chain 主网配置。')
              for err in errors:
                  print(' - ' + err)
              print('如确属演示用途，请在 workflow_dispatch 勾选 allow_demo_deploy=true（会在 summary 留痕）。')
              sys.exit(1)
          if errors and allow_demo:
              print('::warning::allow_demo_deploy=true，已显式绕过生产门禁：')
              for err in errors:
                  print(' - ' + err)
              summary = os.environ.get('GITHUB_STEP_SUMMARY', '')
              if summary:
                  with open(summary, 'a') as f:
                      f.write('## ⚠️ allow_demo_deploy=true：本次部署绕过生产门禁\n\n')
          else:
              print('✅ 生产配置门禁通过：DATA_SOURCE=chain / CHAIN_NETWORK=mainnet / DEMO_ALLOW_UNSIGNED_WRITES=false / 生产 D1 独立')
          PY
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler d1 migrations apply fuse-protocol --remote --env production
      - name: Deploy Worker (env production)
        # 必须 --env production；生产 D1 已在前面注入；真实地址由 GitHub Variables 经 --var 注入（D-38）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_ROUND_CONTROLLER_ADDRESS: ${{ vars.PROD_ROUND_CONTROLLER_ADDRESS }}
          PROD_TEAM_WALLET_ADDRESS: ${{ vars.PROD_TEAM_WALLET_ADDRESS }}
          PROD_KEEPER_ADDRESS: ${{ vars.PROD_KEEPER_ADDRESS }}
          PROD_JETTON_MASTER_ADDRESS: ${{ vars.PROD_JETTON_MASTER_ADDRESS }}
          PROD_ORACLE_CONFIG_HASH: ${{ vars.PROD_ORACLE_CONFIG_HASH }}
          PROD_JUNXIANG_DISTRIBUTOR_ADDRESS: ${{ vars.PROD_JUNXIANG_DISTRIBUTOR_ADDRESS }}
          PROD_TG_BOT_USERNAME: ${{ vars.PROD_TG_BOT_USERNAME }}
        run: |
          args=(--env production)
          [ -n "$PROD_ROUND_CONTROLLER_ADDRESS" ] && args+=(--var "ROUND_CONTROLLER_ADDRESS:$PROD_ROUND_CONTROLLER_ADDRESS")
          [ -n "$PROD_TEAM_WALLET_ADDRESS" ] && args+=(--var "TEAM_WALLET_ADDRESS:$PROD_TEAM_WALLET_ADDRESS")
          [ -n "$PROD_KEEPER_ADDRESS" ] && args+=(--var "KEEPER_ADDRESS:$PROD_KEEPER_ADDRESS")
          [ -n "$PROD_JETTON_MASTER_ADDRESS" ] && args+=(--var "JETTON_MASTER_ADDRESS:$PROD_JETTON_MASTER_ADDRESS")
          [ -n "$PROD_ORACLE_CONFIG_HASH" ] && args+=(--var "ORACLE_CONFIG_HASH:$PROD_ORACLE_CONFIG_HASH")
          [ -n "$PROD_JUNXIANG_DISTRIBUTOR_ADDRESS" ] && args+=(--var "JUNXIANG_DISTRIBUTOR_ADDRESS:$PROD_JUNXIANG_DISTRIBUTOR_ADDRESS")
          [ -n "$PROD_TG_BOT_USERNAME" ] && args+=(--var "TG_BOT_USERNAME:$PROD_TG_BOT_USERNAME")
          ./node_modules/.bin/wrangler deploy "${args[@]}"
